<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Quanty Pro</title>

<style>
body{
  background:#0b1220;
  color:#e2e8f0;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  padding:40px;
}

h1{font-size:32px;margin-bottom:5px;}
.sub{color:#94a3b8;margin-bottom:20px;}
#status{font-size:13px;color:#94a3b8;margin-bottom:30px;}

.section{margin-top:40px;margin-bottom:15px;color:#94a3b8;font-size:14px;}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:15px;
}

.card{
  padding:15px;
  border-radius:12px;
  background:#111827;
  transition:0.2s;
}

.card:hover{transform:translateY(-4px);}

.top{
  display:flex;
  gap:20px;
}

.top .card{
  flex:1;
  border:1px solid #16c784;
}

.badge{
  padding:3px 8px;
  border-radius:6px;
  font-size:12px;
  font-weight:600;
}

.buy{background:#16c784;}
.hold{background:#854d0e;}
.cash{background:#7f1d1d;}

.return{
  font-size:22px;
  font-weight:700;
  margin:10px 0;
}

.bar{
  height:5px;
  background:#1e293b;
  border-radius:3px;
  margin-top:5px;
}

.bar div{
  height:100%;
  background:#16c784;
}

/* METRICS */
.metrics{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.metric{
  background:#111827;
  padding:15px;
  border-radius:12px;
}

.metric-val{
  font-size:20px;
  font-weight:700;
}

/* ALPHA */
.alpha{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.alpha-bar{
  height:8px;
  background:#1e293b;
  border-radius:4px;
  margin-top:6px;
}

.alpha-bar div{
  height:100%;
  background:#16c784;
}
</style>
</head>

<body>

<h1>Quanty Pro</h1>
<div class="sub">Institutional-grade quant dashboard</div>
<div id="status"></div>

<div class="section">Performance</div>
<div class="metrics" id="metrics"></div>

<div class="section">Alpha Breakdown</div>
<div class="alpha" id="alpha"></div>

<div class="section">Top Signals</div>
<div class="top" id="top"></div>

<div class="section">All Signals</div>
<div class="grid" id="signals"></div>

<script>

// ===== CONFIG =====
const URLS = {
  signals: "data/predictions.json?nocache=" + Date.now(),
  metrics: "data/metrics.json?nocache=" + Date.now(),
  alpha: "data/alpha.json?nocache=" + Date.now()
}

// ===== UTIL =====
function safe(num, digits=2){
  if(num === null || num === undefined || isNaN(num)) return "-"
  return num.toFixed(digits)
}

// ===== SIGNAL CARD =====
function signalCard(s){
  const r = s.target_return ?? 0
  const p = s.prob_up ?? 0
  const price = s.price ?? 0
  const tp = price * (1+r)

  return `
  <div class="card">
    <b>${s.ticker}</b>
    <span class="badge ${s.signal.toLowerCase()}">${s.signal}</span>

    <div class="return">${safe(r*100,1)}%</div>

    <div>
      Conf ${safe(p*100,0)}%
      <div class="bar"><div style="width:${p*100}%"></div></div>
    </div>

    <div style="margin-top:6px;">
      $${safe(price)} → $${safe(tp)}
    </div>
  </div>`
}

// ===== METRICS =====
function metricCard(name,val){
  return `
  <div class="metric">
    <div>${name}</div>
    <div class="metric-val">${val}</div>
  </div>`
}

// ===== ALPHA =====
function alphaCard(name,val){
  return `
  <div class="card">
    <div>${name}</div>
    <div class="metric-val">${safe(val*100,1)}%</div>
    <div class="alpha-bar">
      <div style="width:${val*100}%"></div>
    </div>
  </div>`
}

// ===== LOAD =====
Promise.all([
  fetch(URLS.signals).then(r=>r.json()),
  fetch(URLS.metrics).then(r=>r.json()),
  fetch(URLS.alpha).then(r=>r.json()).catch(()=>null)
])
.then(([signals,metrics,alpha])=>{

  document.getElementById("status").innerText =
    `Live • ${signals.length} signals • ${new Date().toLocaleTimeString()}`

  // ===== TOP =====
  const top = signals
    .filter(s=>s.signal==="BUY")
    .sort((a,b)=> (b.target_return??0)-(a.target_return??0))
    .slice(0,3)

  document.getElementById("top").innerHTML =
    top.length ? top.map(signalCard).join("") : "No BUY signals"

  // ===== ALL =====
  document.getElementById("signals").innerHTML =
    signals.map(signalCard).join("")

  // ===== METRICS =====
  if(metrics){
    document.getElementById("metrics").innerHTML =
      metricCard("Return",(metrics.total_return*100).toFixed(1)+"%") +
      metricCard("Sharpe",safe(metrics.sharpe_ratio)) +
      metricCard("Drawdown",(metrics.max_drawdown*100).toFixed(1)+"%") +
      metricCard("Win Rate",(metrics.win_rate*100).toFixed(1)+"%")
  }

  // ===== ALPHA =====
  if(alpha){
    document.getElementById("alpha").innerHTML =
      alphaCard("ML",alpha.ml ?? 0.4) +
      alphaCard("Momentum",alpha.momentum ?? 0.3) +
      alphaCard("Reversion",alpha.reversion ?? 0.2)
  }

})
.catch(err=>{
  console.error(err)
  document.getElementById("status").innerText = "❌ Load failed"
})

</script>

</body>
</html>
